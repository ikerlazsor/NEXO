name: Code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, TypeScript, tests and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        # The current Expo 54 tree contains known transitive advisories, some
        # without a compatible fix. Keep the report visible while Dependabot
        # upgrades are tested; make this blocking once the baseline is cleared.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Bundle Android and iPhone JavaScript
        run: npm run bundle:check
