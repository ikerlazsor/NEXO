name: Code quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, TypeScript, tests and bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use project npm version
        run: npm install --global npm@11.9.0

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production dependencies
        # Critical advisories block immediately. Remaining high advisories are
        # in the Expo/Metro build toolchain and require a tested SDK migration.
        run: npm audit --omit=dev --audit-level=critical

      - name: Check Expo dependency compatibility
        run: npx expo install --check

      - name: Run lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Bundle Android and iPhone JavaScript
        run: npm run bundle:check
