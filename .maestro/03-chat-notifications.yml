appId: com.ikerlazsor.nexo
name: Group chat and notification settings
---
- launchApp:
    clearState: true
- tapOn:
    id: auth-email
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible: 'Descubre planes'
    timeout: 20000
- tapOn: 'Mis Chats'
- tapOn: ${MAESTRO_GROUP_CHAT_TITLE}
- tapOn:
    id: group-chat-message-input
- inputText: 'mensaje-e2e'
- tapOn:
    id: group-chat-send
- assertVisible: 'mensaje-e2e'
- back
- tapOn: 'Usuario'
- tapOn:
    id: profile-open-settings
- assertVisible: 'Notificaciones'
