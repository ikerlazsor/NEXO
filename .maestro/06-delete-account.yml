appId: com.ikerlazsor.nexo
name: Delete a disposable verified account
---
- launchApp:
    clearState: true
- tapOn:
    id: auth-email
- inputText: ${MAESTRO_DELETE_EMAIL}
- tapOn:
    id: auth-password
- inputText: ${MAESTRO_DELETE_PASSWORD}
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    visible: 'Descubre planes'
    timeout: 20000
- tapOn: 'Usuario'
- tapOn:
    id: profile-open-settings
- tapOn: 'Eliminar cuenta'
- tapOn: 'Sí, eliminar'
- extendedWaitUntil:
    visible: 'Iniciar sesión'
    timeout: 20000
