<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#061018" />
  <title>Abrir plan en Nexo!</title>
  <meta name="description" content="Abre este plan en la app Nexo!" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/styles.css?v=20260831v4" />
  <style>
    .plan-open {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem 4rem;
      gap: 0.75rem;
    }
    .plan-open h1 { font-size: 1.5rem; margin: 0; }
    .plan-open p { opacity: 0.8; max-width: 28rem; margin: 0; }
    .plan-open .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="top dark" id="top">
    <div class="top-inner">
      <a class="brand" href="/"><img src="/logo.png" alt="" width="40" height="40" /> Nexo!</a>
    </div>
  </header>

  <main class="plan-open">
    <h1>Abriendo el plan…</h1>
    <p id="hint">Si tienes Nexo! instalada, debería abrirse sola. Si no, descárgala y vuelve a pinchar el enlace.</p>
    <div class="actions">
      <a class="nav-cta" id="openApp" href="#">Abrir en Nexo!</a>
      <a class="nav-cta" href="https://apps.apple.com/app/id6804630497">App Store</a>
      <a class="nav-cta" href="https://play.google.com/store/apps/details?id=com.ikerlazsor.nexo">Google Play</a>
    </div>
  </main>

  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var id = parts[0] === 'plan' ? (parts[1] || '') : '';
      var uuid = /^[0-9a-f-]{36}$/i.test(id) ? id : '';
      var deep = uuid ? ('nexo://plan/' + uuid) : 'nexo://';
      var openBtn = document.getElementById('openApp');
      openBtn.href = deep;
      if (!uuid) {
        document.querySelector('h1').textContent = 'Plan no encontrado';
        document.getElementById('hint').textContent = 'Este enlace no incluye un plan válido.';
        return;
      }
      // Si Universal/App Links ya abrieron la app, no redirigir a nexo:// (evita 2 pantallas).
      var left = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) left = true;
      });
      window.addEventListener('pagehide', function () { left = true; });
      // Solo fallback si seguimos en el navegador (app no instalada / UL no cogió el enlace)
      setTimeout(function () {
        if (left) return;
        try { location.href = deep; } catch (e) {}
      }, 900);
    })();
  </script>
</body>
</html>
