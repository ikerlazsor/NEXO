project_id = "nexo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["nexo://**"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 6

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

[functions.delete-account]
verify_jwt = true

[functions.delete-plan]
verify_jwt = true

[functions.send-push]
verify_jwt = true

[functions.dispatch-push-outbox]
verify_jwt = false

[functions.share-plan]
verify_jwt = false

[functions.share-card]
verify_jwt = false

[functions.sync-madrid-events]
# Independent scheduler secret is checked before any download or database call.
verify_jwt = true
